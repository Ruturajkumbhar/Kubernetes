apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  namespace: config-secret-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx-container
          image: nginx:latest

          ports:
            - containerPort: 80

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_NAME

            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV

            - name: APP_COLOR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_COLOR

            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: username

            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: password

