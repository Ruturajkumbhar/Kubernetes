apiVersion: v1
kind: Pod
metadata:
  name: readiness-pod
  namespace: probes
  labels:
    app: readiness-app

spec:
  containers:
  - name: readiness-container
    image: nginx

    readinessProbe:
      httpGet:
        path: /
        port: 80

      initialDelaySeconds: 10
      periodSeconds: 5

